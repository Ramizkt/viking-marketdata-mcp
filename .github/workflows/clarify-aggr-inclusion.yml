name: Apply aggregated deal guidance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-aggr-inclusion
          persist-credentials: true

      - uses: astral-sh/setup-uv@v5

      - name: Update guidance and contract tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re


          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {pattern[:100]!r}")
              file_path.write_text(updated, encoding="utf-8")


          sub_once(
              "app/main.py",
              r'\s*"aggr=false означает обычную биржевую сделку\. aggr=true означает синтетическую "\n\s*"агрегированную запись: price в ней равна цене исходной заявки и не является "\n\s*"фактической ценой отдельного исполнения\. "',
              '\n        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "\n'
              '        "подсчётах и расчётах наравне с aggr=false — включая количество сделок, quantity, "\n'
              '        "объём, направления buy/sell и общую статистику. Ограничение относится только к "\n'
              '        "price: это цена исходной заявки, а не точная цена отдельного исполнения. "\n'
              '        "В ценозависимых расчётах такую запись также не исключай: используй доступную price "\n'
              '        "и явно помечай результат как оценочный, не называя её точной ценой исполнения. "',
          )

          tool_patterns = [
              r'\s*"Если aggr=true, price — цена исходной заявки в агрегированной записи, а не "\n\s*"фактическая цена отдельного исполнения; aggr=false означает обычную сделку\."',
              r'\s*"aggr=true помечает агрегированную запись: цена исходной заявки, а не "\n\s*"фактическую цену отдельного исполнения; aggr=false — обычную сделку\. "',
              r'\s*"aggr=true означает агрегированную запись: price — цена исходной заявки, "\n\s*"а не фактическая цена отдельного исполнения; aggr=false — обычная сделка\."',
              r'\s*"При aggr=true price — цена исходной заявки в агрегированной записи, а не "\n\s*"фактическая цена отдельного исполнения; aggr=false — обычная сделка\."',
          ]
          tool_replacement = (
              '\n        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "\n'
              '        "подсчётах и расчётах наравне с aggr=false. Ограничение относится только к price: "\n'
              '        "это цена исходной заявки, а не точная цена отдельного исполнения; ценовые результаты "\n'
              '        "помечай как оценочные."'
          )
          for pattern in tool_patterns:
              sub_once("app/main.py", pattern, tool_replacement)

          sub_once(
              "README.md",
              r'В ответах со сделками поле `aggr=false` означает обычную биржевую сделку\.\n`aggr=true` означает синтетическую запись, агрегированную из одной или нескольких\nпоследовательно прошедших сделок по цене исходной заявки\. Поэтому `price` у\nтакой записи — цена заявки, а не фактическая цена отдельного исполнения\. Это\nможет происходить, когда ответ биржи по заявке приходит раньше события сделки\.',
              'В ответах со сделками `aggr=true` — это такая же сделка, как запись с\n'
              '`aggr=false`. Её нельзя отбрасывать: она обязательно учитывается при подсчёте\n'
              'сделок, количества, объёма, направлений buy/sell и в любых других общих расчётах.\n'
              'Запрос «все сделки» всегда включает оба значения `aggr` и не подразумевает\n'
              'автоматический фильтр `aggr=false`.\n\n'
              'Отличается только точность цены. Для `aggr=true` поле `price` содержит цену\n'
              'исходной заявки, а не точную цену отдельного исполнения. В ценозависимых расчётах\n'
              'такую запись тоже нужно учитывать, используя доступную `price`, но результат\n'
              'следует явно помечать как оценочный: фактическая цена исполнения могла быть лучше.',
          )

          sub_once(
              "AGENTS.md",
              r'Поле `aggr` в фактических ответах имеет специальный смысл, хотя во вложенной\nверсии официального `api\.md` оно не перечислено в таблице полей сделки:\n\n- `aggr=false` — обычная запись о биржевой сделке; `price` можно читать как цену\n  этой сделки;\n- `aggr=true` — синтетическая запись, агрегированная из одной или нескольких\n  последовательно прошедших сделок по цене исходной заявки\. В такой записи\n  `price` равна цене заявки и \*\*не является фактической ценой отдельной сделки\*\*\.\n\nТакой агрегат может появиться, когда ответ биржи по заявке приходит раньше\nсобытия со сделкой\. Такая сделка как обычная должна попадать во все рассчеты наряду с остальными сделками имеющими фактическую цену; но её нужно явно помечать как агрегированную и что реальная цена исполнения может быть лучше, чем взятая из заявки цена\.',
              'Поле `aggr` в фактических ответах имеет специальный смысл, хотя во вложенной\n'
              'версии официального `api.md` оно не перечислено в таблице полей сделки:\n\n'
              '- `aggr=false` — обычная запись о биржевой сделке; `price` можно читать как точную\n'
              '  цену этой сделки;\n'
              '- `aggr=true` — синтетическая агрегированная запись о реально прошедшей сделке или\n'
              '  нескольких последовательных сделках. Её `price` равна цене исходной заявки и\n'
              '  **не является точной ценой отдельного исполнения**.\n\n'
              'Критическое правило для агентов: `aggr=true` — это не основание исключать запись.\n'
              'Такие записи нужно учитывать наравне с `aggr=false` во всех подсчётах и расчётах,\n'
              'включая число сделок, `quantity`, объём, направления buy/sell, позиции и общую\n'
              'статистику. Запросы «все сделки», «посчитать сделки» или «проанализировать сделки»\n'
              'всегда относятся к обоим значениям `aggr`; запрещено молча заменять их запросом\n'
              '«найти фактические сделки (`aggr=false`)».\n\n'
              'Ограничение относится только к точности `price`. В ценозависимых расчётах запись\n'
              '`aggr=true` также нельзя отбрасывать: используйте доступную цену исходной заявки и\n'
              'явно помечайте результат как оценочный, не выдавая её за точную цену исполнения.\n'
              'Фактическая цена исполнения могла быть лучше. Агрегат может появиться, когда ответ\n'
              'биржи по заявке приходит раньше события сделки.',
          )

          sub_once(
              "tests/test_mcp.py",
              r'        assert "aggr=true" in description\n        assert "цена исходной заявки" in description\n    history_schema = tools\["get_robot_log_history"\]\.inputSchema\["properties"\]',
              '        assert "aggr=true" in description\n'
              '        assert "цена исходной заявки" in description\n'
              '        assert "не фильтруй" in description\n'
              '        assert "учитывать во всех подсчётах и расчётах" in description\n'
              '    instructions = main.mcp._mcp_server.instructions or ""\n'
              '    assert "aggr=true не фильтруй" in instructions\n'
              '    assert "учитывать во всех подсчётах и расчётах" in instructions\n'
              '    assert "такую запись также не исключай" in instructions\n'
              '    history_schema = tools["get_robot_log_history"].inputSchema["properties"]',
          )
          PY

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/clarify-aggr-inclusion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify aggregated deal inclusion"
          git push origin HEAD:agent/clarify-aggr-inclusion
