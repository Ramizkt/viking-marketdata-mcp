name: Apply aggregated deal guidance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-aggr-inclusion
          persist-credentials: true

      - uses: astral-sh/setup-uv@v5

      - name: Update guidance and contract tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path


          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old[:80]!r}"
                  )
              file_path.write_text(content.replace(old, new), encoding="utf-8")


          replace_exact(
              "app/main.py",
              '''        "aggr=false означает обычную биржевую сделку. aggr=true означает синтетическую "
                      "агрегированную запись: price в ней равна цене исходной заявки и не является "
                      "фактической ценой отдельного исполнения. "''',
              '''        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "
                      "подсчётах и расчётах наравне с aggr=false — включая количество сделок, quantity, "
                      "объём, направления buy/sell и общую статистику. Ограничение относится только к "
                      "price: это цена исходной заявки, а не точная цена отдельного исполнения. "
                      "В ценозависимых расчётах такую запись также не исключай: используй доступную price "
                      "и явно помечай результат как оценочный, не называя её точной ценой исполнения. "''',
          )

          replace_exact(
              "app/main.py",
              '''        "Если aggr=true, price — цена исходной заявки в агрегированной записи, а не "
                      "фактическая цена отдельного исполнения; aggr=false означает обычную сделку."''',
              '''        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "
                      "подсчётах и расчётах наравне с aggr=false. Ограничение относится только к price: "
                      "это цена исходной заявки, а не точная цена отдельного исполнения; ценовые результаты "
                      "помечай как оценочные."''',
          )

          replace_exact(
              "app/main.py",
              '''        "aggr=true помечает агрегированную запись: цена исходной заявки, а не "
                      "фактическую цену отдельного исполнения; aggr=false — обычную сделку. "''',
              '''        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "
                      "подсчётах и расчётах наравне с aggr=false. Ограничение относится только к price: "
                      "это цена исходной заявки, а не точная цена отдельного исполнения; ценовые результаты "
                      "помечай как оценочные. "''',
          )

          replace_exact(
              "app/main.py",
              '''        "aggr=true означает агрегированную запись: price — цена исходной заявки, "
                      "а не фактическая цена отдельного исполнения; aggr=false — обычная сделка."''',
              '''        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "
                      "подсчётах и расчётах наравне с aggr=false. Ограничение относится только к price: "
                      "это цена исходной заявки, а не точная цена отдельного исполнения; ценовые результаты "
                      "помечай как оценочные."''',
          )

          replace_exact(
              "app/main.py",
              '''        "При aggr=true price — цена исходной заявки в агрегированной записи, а не "
                      "фактическая цена отдельного исполнения; aggr=false — обычная сделка."''',
              '''        "Записи aggr=true не фильтруй: это такие же сделки, их нужно учитывать во всех "
                      "подсчётах и расчётах наравне с aggr=false. Ограничение относится только к price: "
                      "это цена исходной заявки, а не точная цена отдельного исполнения; ценовые результаты "
                      "помечай как оценочные."''',
          )

          replace_exact(
              "README.md",
              '''В ответах со сделками поле `aggr=false` означает обычную биржевую сделку.
          `aggr=true` означает синтетическую запись, агрегированную из одной или нескольких
          последовательно прошедших сделок по цене исходной заявки. Поэтому `price` у
          такой записи — цена заявки, а не фактическая цена отдельного исполнения. Это
          может происходить, когда ответ биржи по заявке приходит раньше события сделки.''',
              '''В ответах со сделками `aggr=true` — это такая же сделка, как запись с
          `aggr=false`. Её нельзя отбрасывать: она обязательно учитывается при подсчёте
          сделок, количества, объёма, направлений buy/sell и в любых других общих расчётах.
          Запрос «все сделки» всегда включает оба значения `aggr` и не подразумевает
          автоматический фильтр `aggr=false`.

          Отличается только точность цены. Для `aggr=true` поле `price` содержит цену
          исходной заявки, а не точную цену отдельного исполнения. В ценозависимых расчётах
          такую запись тоже нужно учитывать, используя доступную `price`, но результат
          следует явно помечать как оценочный: фактическая цена исполнения могла быть лучше.''',
          )

          replace_exact(
              "AGENTS.md",
              '''Поле `aggr` в фактических ответах имеет специальный смысл, хотя во вложенной
          версии официального `api.md` оно не перечислено в таблице полей сделки:

          - `aggr=false` — обычная запись о биржевой сделке; `price` можно читать как цену
            этой сделки;
          - `aggr=true` — синтетическая запись, агрегированная из одной или нескольких
            последовательно прошедших сделок по цене исходной заявки. В такой записи
            `price` равна цене заявки и **не является фактической ценой отдельной сделки**.

          Такой агрегат может появиться, когда ответ биржи по заявке приходит раньше
          события со сделкой. Такая сделка как обычная должна попадать во все рассчеты наряду с остальными сделками имеющими фактическую цену; но её нужно явно помечать как агрегированную и что реальная цена исполнения может быть лучше, чем взятая из заявки цена.''',
              '''Поле `aggr` в фактических ответах имеет специальный смысл, хотя во вложенной
          версии официального `api.md` оно не перечислено в таблице полей сделки:

          - `aggr=false` — обычная запись о биржевой сделке; `price` можно читать как точную
            цену этой сделки;
          - `aggr=true` — синтетическая агрегированная запись о реально прошедшей сделке или
            нескольких последовательных сделках. Её `price` равна цене исходной заявки и
            **не является точной ценой отдельного исполнения**.

          Критическое правило для агентов: `aggr=true` — это не основание исключать запись.
          Такие записи нужно учитывать наравне с `aggr=false` во всех подсчётах и расчётах,
          включая число сделок, `quantity`, объём, направления buy/sell, позиции и общую
          статистику. Запросы «все сделки», «посчитать сделки» или «проанализировать сделки»
          всегда относятся к обоим значениям `aggr`; запрещено молча заменять их запросом
          «найти фактические сделки (`aggr=false`)».

          Ограничение относится только к точности `price`. В ценозависимых расчётах запись
          `aggr=true` также нельзя отбрасывать: используйте доступную цену исходной заявки и
          явно помечайте результат как оценочный, не выдавая её за точную цену исполнения.
          Фактическая цена исполнения могла быть лучше. Агрегат может появиться, когда ответ
          биржи по заявке приходит раньше события сделки.''',
          )

          replace_exact(
              "tests/test_mcp.py",
              '''        assert "aggr=true" in description
                  assert "цена исходной заявки" in description
              history_schema = tools["get_robot_log_history"].inputSchema["properties"]''',
              '''        assert "aggr=true" in description
                  assert "цена исходной заявки" in description
                  assert "не фильтруй" in description
                  assert "учитывать во всех подсчётах и расчётах" in description
              instructions = main.mcp._mcp_server.instructions or ""
              assert "aggr=true не фильтруй" in instructions
              assert "учитывать во всех подсчётах и расчётах" in instructions
              assert "такую запись также не исключай" in instructions
              history_schema = tools["get_robot_log_history"].inputSchema["properties"]''',
          )
          PY

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/clarify-aggr-inclusion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify aggregated deal inclusion"
          git push origin HEAD:agent/clarify-aggr-inclusion
