on:
  push:
    branches: [agent/v2-response-contract]
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-response-contract
      - uses: astral-sh/setup-uv@v5
