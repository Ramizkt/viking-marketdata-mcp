    return {
        "data_status": "source_unavailable",
        "error_type": "portfolio_not_found",
        "robot_id": robot_id,
        "portfolio": portfolio,
        "similar_portfolios": get_close_matches(portfolio, names, n=5, cutoff=0.35),
    }
'''
