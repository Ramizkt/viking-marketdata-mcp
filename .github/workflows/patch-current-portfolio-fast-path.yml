name: Patch current portfolio fast path

on:
  push:
    branches:
      - agent/avoid-portfolio-preflight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/avoid-portfolio-preflight
          persist-credentials: true

      - uses: astral-sh/setup-uv@v5

      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("app/service.py")
          text = service_path.read_text(encoding="utf-8")
          text = text.replace(
              "from app.viking_client import VikingClient\n",
              "from app.viking_client import VikingAPIError, VikingClient\n",
              1,
          )
          old = '''    async def get_current_portfolio_data(\n        self,\n        *,\n        robot_id: str,\n        portfolio: str,\n        raw: bool = False,\n    ) -> dict[str, Any]:\n        portfolios = await self.client.list_portfolios()\n        not_found = portfolio_not_found(portfolios, robot_id, portfolio)\n        if not_found is not None:\n            return not_found\n        result = await self.client.get_current_portfolio_data(\n            robot_id=robot_id,\n            portfolio=portfolio,\n        )\n        value = sanitize_value(result["value"])\n'''
          new = '''    async def get_current_portfolio_data(\n        self,\n        *,\n        robot_id: str,\n        portfolio: str,\n        raw: bool = False,\n    ) -> dict[str, Any]:\n        try:\n            result = await self.client.get_current_portfolio_data(\n                robot_id=robot_id,\n                portfolio=portfolio,\n            )\n        except VikingAPIError as exc:\n            try:\n                portfolios = await self.client.list_portfolios()\n            except Exception as diagnostic_exc:\n                raise exc from diagnostic_exc\n            not_found = portfolio_not_found(portfolios, robot_id, portfolio)\n            if not_found is not None:\n                return not_found\n            raise\n        value = sanitize_value(result["value"])\n'''
          if text.count(old) != 1:
              raise SystemExit("expected get_current_portfolio_data block exactly once")
          text = text.replace(old, new, 1)
          service_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_current_portfolio_fast_path.py")
          test_path.write_text(
              '''from types import SimpleNamespace\nfrom unittest.mock import AsyncMock\n\nimport pytest\n\nfrom app.config import Settings\nfrom app.export_store import ExportStore\nfrom app.service import MarketDataService\nfrom app.viking_client import VikingAPIError\n\n\ndef _make_service(tmp_path, *, current_result=None, current_error=None, portfolios=None):\n    settings = Settings(\n        export_dir=tmp_path,\n        public_base_url="https://example.test",\n        export_signing_key="test-signing-key",\n    )\n    current = AsyncMock()\n    if current_error is not None:\n        current.side_effect = current_error\n    else:\n        current.return_value = current_result or {\n            "robot_id": "1",\n            "portfolio": "A",\n            "value": {"name": "A", "disabled": False, "securities": {}},\n            "unsubscribed": True,\n        }\n    if portfolios is None:\n        portfolios = [\n            {\n                "robot_id": "1",\n                "portfolio": "A",\n                "owner": "owner@example.com",\n                "history_available": True,\n            }\n        ]\n    client = SimpleNamespace(\n        get_current_portfolio_data=current,\n        list_portfolios=AsyncMock(return_value=portfolios),\n    )\n    return MarketDataService(settings, client, ExportStore(settings)), client\n\n\nasync def test_current_portfolio_success_skips_portfolio_list_preflight(tmp_path):\n    service, client = _make_service(tmp_path)\n\n    result = await service.get_current_portfolio_data(robot_id="1", portfolio="A")\n\n    assert result["items"][0]["disabled"] is False\n    client.get_current_portfolio_data.assert_awaited_once_with(\n        robot_id="1", portfolio="A"\n    )\n    client.list_portfolios.assert_not_awaited()\n\n\nasync def test_current_portfolio_api_error_enriches_accessible_not_found(tmp_path):\n    service, client = _make_service(\n        tmp_path,\n        current_error=VikingAPIError("Permission denied", code=555),\n        portfolios=[\n            {\n                "robot_id": "1",\n                "portfolio": "Alpha",\n                "owner": "owner@example.com",\n                "history_available": True,\n            },\n            {\n                "robot_id": "1",\n                "portfolio": "Beta",\n                "owner": "owner@example.com",\n                "history_available": False,\n            },\n        ],\n    )\n\n    result = await service.get_current_portfolio_data(\n        robot_id="1", portfolio="Alphx"\n    )\n\n    assert result["error_type"] == "portfolio_not_found"\n    assert result["similar_portfolios"] == ["Alpha"]\n    client.list_portfolios.assert_awaited_once_with()\n\n\nasync def test_current_portfolio_api_error_is_preserved_for_inaccessible_robot(tmp_path):\n    original = VikingAPIError("Permission denied", code=555)\n    service, client = _make_service(\n        tmp_path,\n        current_error=original,\n        portfolios=[\n            {\n                "robot_id": "1",\n                "portfolio": "Alpha",\n                "owner": "owner@example.com",\n                "history_available": True,\n            }\n        ],\n    )\n\n    with pytest.raises(VikingAPIError) as exc_info:\n        await service.get_current_portfolio_data(\n            robot_id="foreign", portfolio="hidden"\n        )\n\n    assert exc_info.value is original\n    client.list_portfolios.assert_awaited_once_with()\n''',
              encoding="utf-8",
          )

          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          note = (
              "\n- Fast-path invariant: `get_current_portfolio_data` must request the portfolio "
              "snapshot directly and must not call `list_portfolios()` before a successful read. "
              "The portfolio list may be fetched only after `VikingAPIError` to enrich an "
              "accessible-robot `portfolio_not_found` diagnostic; otherwise preserve the original "
              "Viking API error.\n"
          )
          if "Fast-path invariant: `get_current_portfolio_data`" not in agents:
              agents_path.write_text(agents.rstrip() + "\n" + note, encoding="utf-8")
          PY

      - name: Format and test
        shell: bash
        run: |
          uv sync --dev
          uv run ruff format app/service.py tests/test_current_portfolio_fast_path.py
          uv run ruff check .
          uv run pytest -q

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-current-portfolio-fast-path.yml
          git add AGENTS.md app/service.py tests/test_current_portfolio_fast_path.py
          git commit -m "fix: avoid portfolio-list preflight on current reads"
          git push origin HEAD:agent/avoid-portfolio-preflight
