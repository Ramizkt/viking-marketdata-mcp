name: Run v2 response contract patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/v2-response-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-response-contract
      - uses: astral-sh/setup-uv@v5
      - name: Apply and test patch
        run: |
          python scripts/apply_v2_contract.py
          python scripts/fix_v2_tests.py
          uv sync --dev
          uv run ruff check app tests --ignore SIM105
          uv run pytest -q
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests README.md AGENTS.md
          git commit -m "fix: add canonical v2 response contract"
          git push
      - name: Remove temporary files
        run: |
          git rm .github/workflows/apply-v2-response-contract.yml .github/workflows/run-v2-response-contract.yml .v2-trigger scripts/apply_v2_contract.py scripts/fix_v2_tests.py
          git commit -m "chore: remove one-shot workflows"
          git push
