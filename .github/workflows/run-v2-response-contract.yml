name: Run v2 response contract patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/v2-response-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-response-contract
      - uses: astral-sh/setup-uv@v5
      - name: Extract and run patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-v2-response-contract.yml').read_text()
          body = source.split("cat > /tmp/apply.py <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          Path('/tmp/apply.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/apply.py
          uv sync --dev
          uv run ruff check .
          uv run pytest -q
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests README.md AGENTS.md
          git commit -m "fix: add canonical v2 response contract"
          git push
      - name: Remove temporary files
        run: |
          git rm .github/workflows/apply-v2-response-contract.yml .github/workflows/run-v2-response-contract.yml .v2-trigger
          git commit -m "chore: remove one-shot workflows"
          git push
