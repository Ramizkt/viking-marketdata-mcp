name: Apply robot trading status fix

on:
  push:
    branches: [agent/fix-robot-trading-re]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Patch implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              p.write_text(text[:a] + replacement.rstrip() + "\n\n" + text[b:])

          replace_between(
              'app/viking_client.py',
              '    async def get_robot_portfolio_summary(',
              '    async def get_current_portfolio_data_many(',
              '''    async def get_robot_portfolio_summary(self, *, robot_id: str) -> dict[str, Any]:
              """Return all portfolio trading flags from one robot.subscribe snapshot."""
              if not robot_id:
                  raise ValueError("robot_id must not be empty")
              response = await self._subscribe("robot.subscribe", {"r_id": robot_id})
              subscription_id = self._required_str(response, "eid")
              try:
                  self._validate_response_identity(response, expected_type="robot.subscribe", expected_eid=subscription_id)
                  if self._required_str(response, "r") != "s":
                      raise VikingProtocolError("robot.subscribe returned an unexpected result; expected r='s'")
                  data = self._required_dict(response, "data")
                  if self._required_str(data, "r_id") != robot_id:
                      raise VikingProtocolError("Unexpected robot.subscribe r_id")
                  value = self._required_dict(data, "value")
                  all_portfolios = self._required_int(value, "p_a")
                  disabled_portfolios = self._required_int(value, "p_d")
                  expired_portfolios = self._required_int(value, "p_e")
                  trading_status = self._required_int(value, "tr")
                  raw_statuses = value.get("re")
                  if not isinstance(raw_statuses, list):
                      raise VikingProtocolError("robot.subscribe value.re must be an array")
                  statuses = []
                  for index, row in enumerate(raw_statuses):
                      if not isinstance(row, dict):
                          raise VikingProtocolError(f"robot.subscribe value.re[{index}] must be an object")
                      name = self._required_str(row, "n")
                      re_flag = row.get("re")
                      free_flag = row.get("f")
                      if not isinstance(re_flag, bool):
                          raise VikingProtocolError(f"robot.subscribe value.re[{index}].re must be boolean")
                      if not isinstance(free_flag, bool):
                          raise VikingProtocolError(f"robot.subscribe value.re[{index}].f must be boolean")
                      statuses.append({
                          "portfolio": name,
                          "trading": re_flag,
                          "status": "trading" if re_flag else "not_trading",
                          "re": re_flag,
                          "f": free_flag,
                      })
              except BaseException:
                  self._subscriptions.pop(subscription_id, None)
                  await self.close()
                  raise
              try:
                  await self._unsubscribe_log_subscription(
                      subscription_id,
                      expected_subscribe_type="robot.subscribe",
                      unsubscribe_type="robot.unsubscribe",
                  )
              except BaseException:
                  self._subscriptions.pop(subscription_id, None)
                  await self.close()
                  raise
              trading_count = sum(1 for item in statuses if item["trading"])
              return {
                  "robot_id": robot_id,
                  "all_portfolios": all_portfolios,
                  "disabled_portfolios": disabled_portfolios,
                  "expired_portfolios": expired_portfolios,
                  "robot_trading_status": trading_status,
                  "robot_trading": False if trading_status == 0 else True if trading_status == 2 else None,
                  "portfolio_statuses": statuses,
                  "portfolio_status_count": len(statuses),
                  "trading_portfolios": trading_count,
                  "not_trading_portfolios": len(statuses) - trading_count,
                  "subscription_closed": True,
              }'''
          )

          replace_between(
              'app/service.py',
              '    async def get_robot_portfolio_trading_status(',
              '    async def subscribe_available_portfolios(',
              '''    async def get_robot_portfolio_trading_status(
              self,
              *,
              robot_id: str,
              trading_only: bool = False,
          ) -> dict[str, Any]:
              if not robot_id:
                  raise ValueError("robot_id must not be empty")
              summary = await self.client.get_robot_portfolio_summary(robot_id=robot_id)
              items = [dict(item) for item in summary["portfolio_statuses"]]
              if trading_only:
                  items = [item for item in items if item["trading"]]
              return envelope(
                  items,
                  notes=[
                      "Trading status comes only from robot.subscribe value.re[].re; "
                      "true means re_sell or re_buy is true. portfolio.disabled is not used."
                  ],
                  robot_id=robot_id,
                  robot_total_count=summary["all_portfolios"],
                  portfolio_status_count=summary["portfolio_status_count"],
                  trading_count=summary["trading_portfolios"],
                  not_trading_count=summary["not_trading_portfolios"],
                  robot_disabled_count=summary["disabled_portfolios"],
                  robot_expired_count=summary["expired_portfolios"],
                  robot_trading_status=summary["robot_trading_status"],
                  robot_trading=summary["robot_trading"],
                  trading_only=trading_only,
                  returned_count=len(items),
                  detail_source="robot.subscribe.value.re",
                  per_portfolio_reads=0,
              )'''
          )

          replace_between(
              'app/main.py',
              '@mcp.tool(\n    title="Статус торговли портфелей робота"',
              '@mcp.tool(\n    title="Подписаться на доступные портфели"',
              '''@mcp.tool(
              title="Статус торговли портфелей робота",
              description=(
                  "Одним robot.subscribe получает весь массив value.re и определяет статус каждого "
                  "портфеля только по re: re=true означает re_sell или re_buy и статус trading; "
                  "re=false означает not_trading. portfolio.disabled для этого не используется. "
                  "trading_only=true возвращает только торгующиеся портфели. Отдельных "
                  "portfolio.subscribe по каждому портфелю нет."
              ),
              annotations=READ_ONLY,
          )
          async def get_robot_portfolio_trading_status(
              robot_id: Annotated[str, Field(min_length=1, description="Идентификатор робота")],
              trading_only: bool = False,
          ) -> CallToolResult:
              try:
                  result = await _service_for_request().get_robot_portfolio_trading_status(
                      robot_id=robot_id, trading_only=trading_only
                  )
              except SUBSCRIPTION_ERRORS as exc:
                  logger.warning("Robot portfolio trading status request failed: %s", exc)
                  return _error_result(exc)
              return CallToolResult(
                  content=[TextContent(
                      type="text",
                      text=(
                          f"Робот {robot_id}: торгуется {result['trading_count']} портфелей, "
                          f"не торгуется {result['not_trading_count']}."
                      ),
                  )],
                  structuredContent=result,
              )'''
          )

          p = Path('app/main.py')
          text = p.read_text()
          text = text.replace(
              '        "Для вопросов о количестве включённых/выключенных портфелей робота или о том, "\n'
              '        "какие именно портфели включены, всегда используй get_robot_portfolio_trading_status; "\n'
              '        "не делай fan-out из get_current_portfolio_data по каждому портфелю. "\n',
              '        "Для вопросов о том, какие портфели робота торгуются или не торгуются, используй "\n'
              '        "get_robot_portfolio_trading_status: статус берётся только из robot.subscribe value.re[].re, "\n'
              '        "где true означает re_sell или re_buy. Не используй portfolio.disabled. "\n'
          )
          p.write_text(text)

          for filename, marker, body in [
              ('README.md', '## Robot portfolio trading status\n', '''## Robot portfolio trading status\n\n`get_robot_portfolio_trading_status` получает весь список одним `robot.subscribe`. Источник статуса — только `value.re`: `n` — имя портфеля, `re=true` означает `re_sell` или `re_buy` и статус `trading`, `re=false` — `not_trading`. `portfolio.disabled` и `p_d` не используются для определения факта торговли. Никаких отдельных `portfolio.subscribe` по портфелям нет; после snapshot выполняется `robot.unsubscribe`.\n'''),
              ('AGENTS.md', '## Robot portfolio trading aggregate\n', '''## Robot portfolio trading aggregate\n\n- `get_robot_portfolio_trading_status` — канонический инструмент для вопросов «торгуется / не торгуется».\n- Единственный источник per-portfolio статуса — `robot.subscribe` -> `value.re`; документация определяет `re[].n` как имя портфеля, `re[].re` как `Is re_sell or re_buy`.\n- `re=true` -> `trading`, `re=false` -> `not_trading`.\n- Не использовать `portfolio.disabled`, `p_d` или `p_a - p_d` для определения торговли.\n- Не делать `available_portfolio_list.subscribe` или fan-out `portfolio.subscribe`: массив `re` всегда приходит целиком в одном snapshot.\n- После snapshot выполнить `robot.unsubscribe`.\n'''),
          ]:
              p = Path(filename)
              text = p.read_text()
              start = text.index(marker)
              p.write_text(text[:start] + body)

          Path('tests/test_robot_portfolio_trading_status.py').write_text('''from types import SimpleNamespace\nfrom unittest.mock import AsyncMock\n\nfrom app.config import Settings\nfrom app.export_store import ExportStore\nfrom app.service import MarketDataService\nfrom app.viking_client import VikingClient\n\n\nasync def test_robot_summary_uses_re_even_when_disabled_counter_disagrees():\n    client = object.__new__(VikingClient)\n    client._subscriptions = {"sub": object()}\n    client._subscribe = AsyncMock(return_value={\n        "type": "robot.subscribe", "eid": "sub", "ts": 1, "r": "s",\n        "data": {"r_id": "998", "value": {\n            "p_a": 2, "p_d": 2, "p_e": 0, "tr": 2,\n            "re": [\n                {"n": "alpha", "f": True, "re": True},\n                {"n": "beta", "f": True, "re": False},\n            ],\n        }},\n    })\n    client._unsubscribe_log_subscription = AsyncMock(return_value={"unsubscribed": True})\n    client.close = AsyncMock()\n    result = await client.get_robot_portfolio_summary(robot_id="998")\n    assert result["disabled_portfolios"] == 2\n    assert result["trading_portfolios"] == 1\n    assert result["portfolio_statuses"][0]["status"] == "trading"\n    assert result["portfolio_statuses"][0]["re"] is True\n\n\ndef _service(tmp_path, client):\n    settings = Settings(export_dir=tmp_path, public_base_url="https://example.test", export_signing_key="test")\n    return MarketDataService(settings, client, ExportStore(settings))\n\n\nasync def test_service_returns_all_re_statuses_without_fanout(tmp_path):\n    client = SimpleNamespace(get_robot_portfolio_summary=AsyncMock(return_value={\n        "all_portfolios": 2, "disabled_portfolios": 2, "expired_portfolios": 0,\n        "robot_trading_status": 2, "robot_trading": True,\n        "portfolio_status_count": 2, "trading_portfolios": 1, "not_trading_portfolios": 1,\n        "portfolio_statuses": [\n            {"portfolio": "alpha", "trading": True, "status": "trading", "re": True, "f": True},\n            {"portfolio": "beta", "trading": False, "status": "not_trading", "re": False, "f": True},\n        ],\n    }))\n    result = await _service(tmp_path, client).get_robot_portfolio_trading_status(robot_id="998")\n    assert result["detail_source"] == "robot.subscribe.value.re"\n    assert result["per_portfolio_reads"] == 0\n    assert [x["status"] for x in result["items"]] == ["trading", "not_trading"]\n\n\nasync def test_trading_only_filters_re_true(tmp_path):\n    client = SimpleNamespace(get_robot_portfolio_summary=AsyncMock(return_value={\n        "all_portfolios": 2, "disabled_portfolios": 0, "expired_portfolios": 0,\n        "robot_trading_status": 2, "robot_trading": True,\n        "portfolio_status_count": 2, "trading_portfolios": 1, "not_trading_portfolios": 1,\n        "portfolio_statuses": [\n            {"portfolio": "alpha", "trading": True, "status": "trading", "re": True, "f": True},\n            {"portfolio": "beta", "trading": False, "status": "not_trading", "re": False, "f": True},\n        ],\n    }))\n    result = await _service(tmp_path, client).get_robot_portfolio_trading_status(robot_id="998", trading_only=True)\n    assert [x["portfolio"] for x in result["items"]] == ["alpha"]\n''')

          p = Path('tests/test_mcp.py')
          text = p.read_text()
          anchor = '    assert tools["get_robot_portfolio_trading_status"].annotations.readOnlyHint is True\n'
          text = text.replace(anchor, anchor + '    schema = tools["get_robot_portfolio_trading_status"].inputSchema["properties"]\n    assert "trading_only" in schema\n    assert "enabled_only" not in schema\n    assert "include_items" not in schema\n')
          p.write_text(text)
          PY
      - name: Test
        run: |
          uv run pytest tests/test_robot_portfolio_trading_status.py tests/test_mcp.py
          uv run ruff check app/viking_client.py app/service.py app/main.py tests/test_robot_portfolio_trading_status.py tests/test_mcp.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md app/main.py app/service.py app/viking_client.py tests/test_mcp.py tests/test_robot_portfolio_trading_status.py
          git commit -m "fix: derive portfolio trading from robot re flags"
          git push
