name: Implement robot portfolio trading aggregate

on:
  push:
    branches:
      - agent/robot-portfolio-trading-status
    paths:
      - .github/workflows/implement-robot-portfolio-status.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/robot-portfolio-trading-status
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
      - name: Recover and apply patch
        shell: bash
        run: |
          git show d783cc36549d14534c5e21a195d049025a27dab3:.github/workflows/implement-robot-portfolio-status.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Verify"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          source_lines = text[start:end].splitlines()
          normalized = []
          in_triple = False
          for line in source_lines:
              has_triple = "'''" in line
              if in_triple:
                  if has_triple:
                      normalized.append(line[10:] if line.startswith('          ') else line)
                      in_triple = False
                  else:
                      normalized.append(line)
              else:
                  normalized.append(line[10:] if line.startswith('          ') else line)
                  if has_triple and line.count("'''") % 2 == 1:
                      in_triple = True
          Path('.tmp_implement_robot_status.py').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          python .tmp_implement_robot_status.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_mcp.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        "get_current_portfolio_data",\n'
          replacement = anchor + '        "get_robot_portfolio_trading_status",\n'
          if text.count(anchor) != 1:
              raise SystemExit('tests/test_mcp.py: expected tool-list anchor exactly once')
          text = text.replace(anchor, replacement, 1)
          anchor = '    assert tools["get_current_portfolio_data"].annotations.idempotentHint is True\n'
          replacement = (
              anchor
              + '    assert tools["get_robot_portfolio_trading_status"].annotations.idempotentHint is True\n'
              + '    assert tools["get_robot_portfolio_trading_status"].annotations.readOnlyHint is True\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('tests/test_mcp.py: expected annotation anchor exactly once')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          rm .tmp_implement_robot_status.py
      - name: Verify
        shell: bash
        run: |
          uv sync --dev
          uv run ruff check .
          uv run pytest -q
      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-robot-portfolio-status.yml
          git add -u .tmp_implement_robot_status.py
          git add app/viking_client.py app/service.py app/main.py tests/test_robot_portfolio_trading_status.py tests/test_mcp.py README.md AGENTS.md
          git commit -m "feat: add robot portfolio trading status aggregate"
          git push origin HEAD:agent/robot-portfolio-trading-status
