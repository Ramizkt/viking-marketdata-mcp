name: Materialize robot portfolio aggregate patch

on:
  push:
    branches:
      - agent/robot-portfolio-trading-status
    paths:
      - .github/workflows/implement-robot-portfolio-status.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/robot-portfolio-trading-status
          fetch-depth: 3
          persist-credentials: true
      - name: Recover patch script from first workflow revision
        shell: bash
        run: |
          git show HEAD^^:.github/workflows/implement-robot-portfolio-status.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Verify"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          normalized = [line[10:] if line.startswith('          ') else line for line in lines]
          Path('.tmp_implement_robot_status.py').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_implement_robot_status.py
          git commit -m "chore: materialize robot status patch script"
          git push origin HEAD:agent/robot-portfolio-trading-status
