name: Finalize PR22

on:
  push:
    branches: [agent/fix-robot-trading-re]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-robot-trading-re
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Restore unrelated validation and coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/viking_client.py')
          text = p.read_text()
          needle = '''            trading_status = self._required_int(value, "tr")
            raw_statuses = value.get("re")
'''
          replacement = '''            trading_status = self._required_int(value, "tr")
            if all_portfolios < 0:
                raise VikingProtocolError("robot.subscribe p_a must be non-negative")
            if not 0 <= disabled_portfolios <= all_portfolios:
                raise VikingProtocolError("robot.subscribe p_d must be in range 0..p_a")
            if expired_portfolios < 0:
                raise VikingProtocolError("robot.subscribe p_e must be non-negative")
            if trading_status not in {0, 2, 3}:
                raise VikingProtocolError("robot.subscribe tr must be 0, 2 or 3")
            raw_statuses = value.get("re")
'''
          if needle not in text:
              raise SystemExit('viking_client validation anchor not found')
          p.write_text(text.replace(needle, replacement, 1))

          p = Path('tests/test_robot_portfolio_trading_status.py')
          text = p.read_text()
          if 'test_grouped_current_portfolio_reads_use_max_50_messages' not in text:
              text = text.replace(
                  'from types import SimpleNamespace\n',
                  'import asyncio\nimport json\nfrom types import SimpleNamespace\n',
                  1,
              )
              text = text.replace(
                  'from unittest.mock import AsyncMock\n\n',
                  'from unittest.mock import AsyncMock\n\nfrom websockets.protocol import State\n\n',
                  1,
              )
              marker = 'async def test_robot_summary_uses_re_even_when_disabled_counter_disagrees():\n'
              grouped = '''class _GroupedFakeWebSocket:
    state = State.OPEN

    def __init__(self, client):
        self.client = client
        self.sent = []

    async def send(self, raw):
        payloads = json.loads(raw)
        assert isinstance(payloads, list)
        assert 1 <= len(payloads) <= 50
        self.sent.append(payloads)
        for payload in payloads:
            eid = payload["eid"]
            message_type = payload["type"]
            if message_type == "portfolio.subscribe":
                portfolio = payload["data"]["p_id"]
                response = {
                    "type": message_type,
                    "eid": eid,
                    "ts": 1,
                    "r": "s",
                    "data": {
                        "r_id": payload["data"]["r_id"],
                        "p_id": portfolio,
                        "value": {
                            "name": portfolio,
                            "disabled": portfolio.endswith("-disabled"),
                            "securities": {},
                        },
                    },
                }
            else:
                response = {
                    "type": message_type,
                    "eid": eid,
                    "ts": 2,
                    "r": "p",
                    "data": {},
                }
            self.client._pending[eid].set_result(response)


async def test_grouped_current_portfolio_reads_use_max_50_messages():
    client = object.__new__(VikingClient)
    client.settings = SimpleNamespace(viking_request_timeout_seconds=1)
    client._pending = {}
    client._subscriptions = {}
    client._send_lock = asyncio.Lock()
    client._ensure_connected = AsyncMock()
    client.close = AsyncMock()
    ws = _GroupedFakeWebSocket(client)
    client._ws = ws

    portfolios = [f"p-{index}" for index in range(51)]
    result = await client.get_current_portfolio_data_many(
        robot_id="998",
        portfolios=portfolios,
    )

    assert result["item_count"] == 51
    assert result["cleanup_reconnected"] is False
    assert [len(group) for group in ws.sent] == [50, 1, 50, 1]
    assert all(item["ok"] for item in result["items"])
    assert client._subscriptions == {}


'''
              if marker not in text:
                  raise SystemExit('grouped test anchor not found')
              text = text.replace(marker, grouped + marker, 1)
          p.write_text(text)
          PY

      - name: Validate
        run: |
          uv run ruff format app/viking_client.py tests/test_robot_portfolio_trading_status.py
          uv run ruff check app tests
          uv run pytest

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/viking_client.py tests/test_robot_portfolio_trading_status.py
          git commit -m "test: preserve robot summary validation coverage"
          git push
