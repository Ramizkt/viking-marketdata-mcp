name: Rebuild minimal robot trading diff

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Rebuild target files from main with only semantic changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          current_client = Path('app/viking_client.py').read_text()
          current_service = Path('app/service.py').read_text()
          current_main = Path('app/main.py').read_text()
          Path('/tmp/client_block').write_text(block(
              current_client,
              '    async def get_robot_portfolio_summary(',
              '    async def get_current_portfolio_data_many(',
          ))
          Path('/tmp/service_block').write_text(block(
              current_service,
              '    async def get_robot_portfolio_trading_status(',
              '    async def subscribe_available_portfolios(',
          ))
          Path('/tmp/main_tool_block').write_text(block(
              current_main,
              '@mcp.tool(\n    title="Статус торговли портфелей робота"',
              '@mcp.tool(\n    title="Подписаться на доступные портфели"',
          ))
          Path('/tmp/trading_test').write_text(Path('tests/test_robot_portfolio_trading_status.py').read_text())
          for filename, marker, out in [
              ('README.md', '## Robot portfolio trading status\n', '/tmp/readme_section'),
              ('AGENTS.md', '## Robot portfolio trading aggregate\n', '/tmp/agents_section'),
          ]:
              text = Path(filename).read_text()
              Path(out).write_text(text[text.index(marker):])
          PY

          git checkout origin/main -- AGENTS.md README.md app/main.py app/service.py app/viking_client.py tests/test_mcp.py tests/test_robot_portfolio_trading_status.py

          python - <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              p.write_text(text[:start] + replacement.rstrip() + '\n\n' + text[end:])

          replace_between(
              'app/viking_client.py',
              '    async def get_robot_portfolio_summary(',
              '    async def get_current_portfolio_data_many(',
              Path('/tmp/client_block').read_text(),
          )
          replace_between(
              'app/service.py',
              '    async def get_robot_portfolio_trading_status(',
              '    async def subscribe_available_portfolios(',
              Path('/tmp/service_block').read_text(),
          )
          replace_between(
              'app/main.py',
              '@mcp.tool(\n    title="Статус торговли портфелей робота"',
              '@mcp.tool(\n    title="Подписаться на доступные портфели"',
              Path('/tmp/main_tool_block').read_text(),
          )

          p = Path('app/main.py')
          text = p.read_text()
          old = (
              '        "Для вопросов о количестве включённых/выключенных портфелей робота или о том, "\n'
              '        "какие именно портфели включены, всегда используй get_robot_portfolio_trading_status; "\n'
              '        "не делай fan-out из get_current_portfolio_data по каждому портфелю. "\n'
          )
          new = (
              '        "Для вопросов о том, какие портфели робота торгуются или не торгуются, используй "\n'
              '        "get_robot_portfolio_trading_status: статус берётся только из robot.subscribe value.re[].re, "\n'
              '        "где true означает re_sell или re_buy. Не используй portfolio.disabled. "\n'
          )
          if old not in text:
              raise SystemExit('main instructions anchor missing')
          p.write_text(text.replace(old, new, 1))

          for filename, marker, source in [
              ('README.md', '## Robot portfolio trading status\n', '/tmp/readme_section'),
              ('AGENTS.md', '## Robot portfolio trading aggregate\n', '/tmp/agents_section'),
          ]:
              p = Path(filename)
              text = p.read_text()
              p.write_text(text[:text.index(marker)] + Path(source).read_text())

          Path('tests/test_robot_portfolio_trading_status.py').write_text(Path('/tmp/trading_test').read_text())

          p = Path('tests/test_mcp.py')
          text = p.read_text()
          anchor = '    assert tools["get_robot_portfolio_trading_status"].annotations.readOnlyHint is True\n'
          addition = (
              anchor
              + '    schema = tools["get_robot_portfolio_trading_status"].inputSchema["properties"]\n'
              + '    assert "trading_only" in schema\n'
              + '    assert "enabled_only" not in schema\n'
              + '    assert "include_items" not in schema\n'
          )
          if anchor not in text:
              raise SystemExit('test_mcp anchor missing')
          p.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Test and lint
        run: |
          uv run pytest tests/test_robot_portfolio_trading_status.py tests/test_mcp.py
          uv run ruff check app/viking_client.py app/service.py app/main.py tests/test_robot_portfolio_trading_status.py tests/test_mcp.py
      - name: Commit minimal project diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md app/main.py app/service.py app/viking_client.py tests/test_mcp.py tests/test_robot_portfolio_trading_status.py
          git commit -m "chore: minimize robot trading status diff"
          git push
