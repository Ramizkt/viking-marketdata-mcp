name: Prepare locked build documentation
on:
  push:
    branches: [agent/locked-production-build]
    paths: [.github/workflows/locked-build-prep.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Ramizkt/viking-marketdata-mcp' && github.ref == 'refs/heads/agent/locked-production-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Apply narrow documentation updates with exact input guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object AGENTS.md)" = 0546aae5c4e0a9ee499f50a56ba21638f2803ed5
          test "$(git hash-object README.md)" = 5c856147d63fd55cc6b66244dface273da5e78eb
          python - <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text()
          begin = s.index('В репозитории есть один процессный GitHub Actions workflow:')
          end = s.index('## 10. Тестирование и правила кода', begin)
          s = s[:begin] + '''В репозитории есть два постоянных CI workflow:
          `.github/workflows/agents-context.yml` проверяет содержательную актуализацию
          AGENTS.md при изменениях кода/config/deploy, а `python-tests.yml` выполняет
          locked regression suite и Ruff на Python 3.11/3.12, сборку production Docker,
          сравнение всех установленных версий с экспортом uv.lock и полные тесты
          установленного wheel в производном test-only образе без внешней сети.
          Отдельно проверяются штатный CMD/PORT/health/OAuth discovery/CORS и отказ
          сборки при устаревшем lock. Тесты не используют реальные Viking credentials.
          Проверка AGENTS.md сама по себе не доказывает успех тестов или deploy.
          Обновление документации должно быть по существу, а не пробелом/датой.
          Полный контракт и границы воспроизводимости: docs/locked-builds.md.

          ''' + s[end:]
          s = s.replace('uv sync --dev', 'uv sync --locked')
          s = s.replace('uv run ruff check .', 'uv run --locked ruff check .')
          s = s.replace('uv run pytest -q', 'uv run --locked pytest -q')
          s = s.replace('uv run uvicorn app.main:app', 'uv run --locked uvicorn app.main:app')
          marker = '## 11. Deploy и эксплуатация\n'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '''
          Python-зависимости production устанавливаются только через
          `uv sync --locked --no-dev --no-editable` из закоммиченного uv.lock.
          Dockerfile использует uv 0.12.17, как CI; runtime копирует готовую .venv,
          запускает установленный wheel и не устанавливает пакеты при старте.
          Не возвращать pip install . / автоматический re-lock / --frozen fallback.
          Изменение pyproject.toml без соответствующего lock должно ломать сборку.
          Dockerfile.ci — только тестовый образ; его нельзя выбирать в Railway.
          Все runtime-версии сверяются с lock, dev-пакеты исключены из production;
          `scripts/check_runtime_lock.py` также проверяет SHA-256 lock и импорт wheel.
          Это фиксация Python runtime, не побитовая воспроизводимость ОС/base images.
          При обновлении uv согласованно менять Dockerfiles/CI и проверку build policy.
          API/OAuth, PORT, /health и Volume /data этим контрактом не меняются.
          Не удалять OAuth stores и не вращать секреты для перехода на locked build.
          Подробнее: docs/locked-builds.md.
          ''')
          p.write_text(s)
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('uv sync --dev', 'uv sync --locked')
          s = s.replace('uv run pytest\n', 'uv run --locked pytest\n')
          s = s.replace('uv run uvicorn app.main:app', 'uv run --locked uvicorn app.main:app')
          marker = '## Railway\n'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '''
          Production Dockerfile устанавливает Python-пакеты по `uv.lock` через
          `uv sync --locked --no-dev --no-editable`, а не по плавающим диапазонам.
          Отсутствующий или устаревший lock останавливает build. При старте пакеты
          не переустанавливаются; PORT, /health и постоянный Volume /data сохранены.
          CI проверяет фактические версии production-образа, запускает полные тесты
          установленного wheel в отдельном test-only контейнере и HTTP smoke.
          Обновление зависимостей требует явного изменения lock и прохождения CI.
          [Контракт сборки, проверки и rollout](docs/locked-builds.md).
          ''')
          p.write_text(s)
          PY
      - run: uv sync --locked
      - name: Format only new code and run regressions
        run: |
          uv run --locked ruff format scripts/check_runtime_lock.py scripts/smoke_runtime_http.py tests/test_locked_build.py
          uv run --locked ruff check scripts/check_runtime_lock.py scripts/smoke_runtime_http.py tests/test_locked_build.py --fix
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Commit code and documentation to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/locked-production-build
          test "$(git ls-remote origin refs/heads/agent/locked-production-build | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- uv.lock pyproject.toml app railway.json .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md scripts/check_runtime_lock.py scripts/smoke_runtime_http.py tests/test_locked_build.py
          git diff --cached --check
          git commit -m 'Document locked production contract and format verification checks'
          git push origin HEAD:refs/heads/agent/locked-production-build
