name: Bootstrap robot trading status fix

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Enable one-shot push workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-robot-trading-re.yml')
          text = p.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "")
          p.write_text(text)
          PY
          rm .github/workflows/bootstrap-fix-robot-trading-re.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-robot-trading-re.yml .github/workflows/bootstrap-fix-robot-trading-re.yml
          git commit -m "chore: trigger robot trading status fix"
          git push
