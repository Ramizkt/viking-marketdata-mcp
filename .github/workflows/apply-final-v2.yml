name: Apply final v2 edge cases
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/v2-response-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-response-contract
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: python scripts/finalize_v2.py
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests
          git commit -m "fix: handle empty portfolio history explicitly"
          git pull --rebase origin agent/v2-response-contract
          git push
      - name: Remove temporary files
        run: |
          git rm .github/workflows/apply-final-v2.yml scripts/finalize_v2.py .final-v2-trigger
          git commit -m "chore: remove final v2 patch tooling"
          git pull --rebase origin agent/v2-response-contract
          git push
