[project]
name = "viking-marketdata-mcp"
version = "0.1.0"
description = "MCP server for listing Viking portfolios and downloading portfolio history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45,<48",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.5,<3",
    "uvicorn>=0.31,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
